<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="100%" stop-color="#0b0c0e" />
    </linearGradient>

    <!-- Vibrant Mint Gradient for Code Chevron -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66ffd9" />
      <stop offset="100%" stop-color="#00cc99" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00cc99" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Monogram M: Left Column (White) -->
  <rect x="14" y="17" width="7" height="30" rx="3.5" fill="#FFFFFF" />

  <!-- Monogram M: Right Column (White) -->
  <rect x="43" y="17" width="7" height="30" rx="3.5" fill="#FFFFFF" />

  <!-- Monogram M: Center Developer Chevron (Glowing Mint) -->
  <path d="M 18 21 L 32 37 L 46 21" fill="none" stroke="url(#mintGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
